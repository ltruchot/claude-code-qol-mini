version: 1
placeholders:
  - name: TOKEN_PREFIX
    prompt: Design token prefix, such as --ds or --wp--preset
    pattern: "^--[a-z0-9]+(-{1,2}[a-z0-9]+)*$"
  - name: TOKENS_FILE
    prompt: Path to the file that defines the design tokens
    type: path
  - name: CSS_PATHS
    prompt: Globs that load this skill, comma-separated
    default: "**/*.css"
